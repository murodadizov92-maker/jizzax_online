name: APK yig'ish

on:
  push:
    paths:
      - '2_telefon_ilovasi_APK/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK yig'ish
        working-directory: 2_telefon_ilovasi_APK
        run: gradle assembleRelease --no-daemon
      - name: Nom berish
        working-directory: 2_telefon_ilovasi_APK
        run: cp app/build/outputs/apk/release/app-release.apk ../MC-Xodim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MC-Xodim-apk
          path: MC-Xodim.apk
